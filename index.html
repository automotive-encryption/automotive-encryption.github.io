      a1: "We work with various brands and models. Contact us with your specific case.",
      q2: "What is the response time?",
      a2: "We usually respond within 48 business hours after receiving the data.",

      q1: "Quali tipi di seed key risolvete?",
      a1: "Lavoriamo con diversi marchi e modelli. Contattaci con il tuo caso specifico.",

      ]

  };

  let newsIndex = 0;
  let newsTimer;

  window.addEventListener('DOMContentLoaded', () => {
    const langSelect = document.getElementById('language');

    const safeSetText = (selector, value) => {
      const el = document.querySelector(selector);
      if (el) el.textContent = value;
    };

    const safeSetPlaceholder = (selector, value) => {
      const el = document.querySelector(selector);
      if (el) el.placeholder = value;
    };

    const updateContent = (lang) => {
      const t = translations[lang];

      // atualiza atributo lang do <html>
      document.documentElement.lang = (lang === 'zh' ? 'zh-Hans' : lang);
      // atualiza href do canonical
      document.getElementById('canonical').href =
        lang === 'it' ? 'https://automotive-encryption.github.io/' :
        lang === 'en' ? 'https://automotive-encryption.github.io/?lang=en' :
                        'https://automotive-encryption.github.io/?lang=zh';

      safeSetText('#main-title', t.title);
      safeSetText('#main-subtitle', t.subtitle);
      safeSetText('#how-it-works-title', t.howItWorks);
      safeSetText('#intro-text', t.introText);

      const steps = document.querySelectorAll('section:nth-of-type(1) ul li');
      steps.forEach((li, i) => {
        if (t.steps[i]) li.textContent = t.steps[i];
      });

      safeSetText('#send-data-title', t.sendData);
      safeSetPlaceholder('#form-name', t.name);
      safeSetPlaceholder('#form-email', t.email);
      safeSetPlaceholder('#form-message', t.message);
      safeSetText('#form-button', t.sendButton);
      safeSetText('#form-email-direct', `${t.orSend} automotive.encryption@protonmail.com`);

      safeSetText('#faq-title', t.faq);
      safeSetText('#faq-q1', `${t.q1}\n${t.a1}`);
      safeSetText('#faq-q2', `${t.q2}\n${t.a2}`);
      safeSetText('#faq-q3', `${t.q3}\n${t.a3}`);

      safeSetText('#news-title', t.newsTitle);
      const newsBox = document.getElementById('news-text');
      if (newsBox) {
        newsIndex = 0;
        newsBox.textContent = t.newsItems[0];
        clearInterval(newsTimer);
        newsTimer = setInterval(() => {
          newsIndex = (newsIndex + 1) % t.newsItems.length;
          newsBox.textContent = t.newsItems[newsIndex];
        }, 5000);
      }

      safeSetText('#footer-text', t.copyright);
    };

    const defaultLang = 'it';
    langSelect.value = defaultLang;
    langSelect.addEventListener('change', () => updateContent(langSelect.value));
    updateContent(defaultLang);
  });
</script>
